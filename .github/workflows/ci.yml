name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --ignore-scripts

      - name: Prepare WXT
        run: npx wxt prepare

      - name: Cache node_modules and .wxt
        uses: actions/cache/save@v4
        with:
          path: |
            node_modules
            .wxt
          key: deps-${{ github.sha }}

  lint:
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Restore cache
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            .wxt
          key: deps-${{ github.sha }}

      - name: Lint
        run: npx eslint .

  typecheck:
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Restore cache
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            .wxt
          key: deps-${{ github.sha }}

      - name: Type-check
        run: npx tsc --noEmit

  build:
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Restore cache
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            .wxt
          key: deps-${{ github.sha }}

      - name: Build (Chrome)
        run: npx wxt build

      - name: Build (Firefox)
        run: npx wxt build -b firefox
